# ══════════════════════════════════════════════════════════
#  Ansible Inventory — список керованих хостів
#  Методології автоматизованого розгортання ІТ інфраструктури
#
#  КРОК 1: виконайте terraform apply у директорії ../terraform/
#  КРОК 2: скопіюйте значення 'ansible_inventory_entry' з виводу
#  КРОК 3: вставте його замість рядка-заглушки нижче
#
#  Приклад виводу terraform:
#  ansible_inventory_entry = "3.85.142.201 ansible_user=ec2-user ansible_ssh_private_key_file=../vockey.pem"
# ══════════════════════════════════════════════════════════

# Група 'webservers' — до неї звертається playbook.yml (hosts: webservers)
[webservers]
54.209.199.14 ansible_user=ec2-user ansible_ssh_private_key_file=/home/enduro/.ssh/vockey.pem

# ── Що означають параметри ─────────────────────────────────
# ansible_user                  — SSH користувач для підключення
# ansible_ssh_private_key_file  — шлях до приватного ключа (відносно ansible.cfg)
# ansible_port                  — SSH порт (за замовчуванням 22, можна не вказувати)
#
# ── Опціонально: іменований хост ──────────────────────────
# [webservers]
# ansible-lab ansible_host=<EC2_PUBLIC_IP> ansible_user=ec2-user ansible_ssh_private_key_file=../vockey.pem
