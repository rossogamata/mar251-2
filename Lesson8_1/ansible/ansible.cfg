# ══════════════════════════════════════════════════════════
#  ansible.cfg — конфігурація Ansible
#  Методології автоматизованого розгортання ІТ інфраструктури
#
#  Ansible шукає конфігурацію у такому порядку пріоритету:
#  1. ANSIBLE_CONFIG (змінна середовища)
#  2. ./ansible.cfg  ← цей файл (у поточній директорії)
#  3. ~/.ansible.cfg
#  4. /etc/ansible/ansible.cfg
# ══════════════════════════════════════════════════════════

[defaults]

# Файл інвентаризації — де знаходиться список хостів
inventory = inventory/hosts.ini

# Стандартний користувач для SSH підключення
# Для Amazon Linux 2023 це завжди 'ec2-user'
remote_user = ec2-user

# Шлях до приватного SSH ключа
# Скопіюйте vockey.pem із AWS Academy поруч із директорією ansible/
private_key_file = /home/enduro/.ssh/vockey.pem

# Вимкнути перевірку відбитку хоста при першому підключенні.
# Зручно для тимчасових EC2 інстансів, де IP змінюється при кожному запуску.
# УВАГА: у постійному production середовищі рекомендовано встановити True.
host_key_checking = False

# Кількість хостів, якими Ansible керує одночасно (паралельність).
# За замовчуванням 5 — достатньо для учбового середовища.
forks = 5

# Формат виводу результатів виконання задач.
# 'yaml' — читабельний структурований вивід.
# Альтернативи: 'json', 'minimal', 'debug'.
stdout_callback = yaml

# Вимкнути збір статистики використання (не впливає на функціональність)
deprecation_warnings = False

[privilege_escalation]

# Автоматично використовувати sudo для всіх задач, де задано become: true
become        = True
become_method = sudo
become_user   = root
