---
# ══════════════════════════════════════════════════════════
#  Ansible Playbook — Налаштування сервера
#  Методології автоматизованого розгортання ІТ інфраструктури
#
#  Що робить цей playbook:
#    1. Створює 10 системних користувачів (зі списку у group_vars/all.yml)
#    2. Встановлює пакети: git, docker, net-tools
#    3. Запускає та вмикає сервіс Docker
#    4. Додає відповідних користувачів до групи docker
#
#  Запуск:
#    ansible-playbook playbook.yml
#
#  Dry run (нічого не змінювати, лише показати що зміниться):
#    ansible-playbook playbook.yml --check --diff
#
#  Детальний вивід для відлагодження:
#    ansible-playbook playbook.yml -v
#    ansible-playbook playbook.yml -vvv
# ══════════════════════════════════════════════════════════

# ── Play ───────────────────────────────────────────────────
# Play — верхній рівень playbook. Визначає: НА ЯКИХ хостах і ЯК виконувати задачі.
# Один файл playbook може містити кілька Play (список через дефіс '-').
- name: Налаштування сервера — користувачі, пакети, Docker
  hosts: webservers  # виконувати на хостах групи 'webservers' з inventory/hosts.ini
  become: true       # підвищити привілеї до root (sudo) для всіх задач цього Play


  # ── tasks ────────────────────────────────────────────────
  # tasks — список задач, що виконуються ПОСЛІДОВНО, зверху вниз.
  # Якщо будь-яка задача завершується помилкою — виконання зупиняється.
  tasks:


    # ════════════════════════════════════════════════════
    # ЗАДАЧА 1: Створення системних користувачів
    # ════════════════════════════════════════════════════
    #
    # Модуль: ansible.builtin.user
    # Керує обліковими записами Linux (/etc/passwd, /etc/shadow, /etc/group).
    # Ідемпотентний: якщо користувач вже існує — перевіряє параметри і лише
    # застосовує відмінності (не видаляє і не перестворює).
    #
    # Аналог shell-команди:
    #   useradd --comment "Deployment service account" \
    #           --shell /bin/bash \
    #           --groups docker \
    #           --create-home \
    #           deploy
    # ────────────────────────────────────────────────────
    - name: Create a new group
      ansible.builtin.group:
        name: docker
        state: present
        gid: 1050


    - name: "Створити системного користувача {{ item.name }}"
      ansible.builtin.user:

        name: "{{ item.name }}"
        # {{ item.name }} — Jinja2 шаблон. При виконанні замінюється на реальне значення.
        # item — поточний елемент ітерації (один об'єкт зі списку users).

        comment: "{{ item.comment }}"
        # GECOS поле — відображається в 'finger', 'id', '/etc/passwd'.
        # Корисно для документування призначення акаунту.

        shell: "{{ item.shell }}"
        # /bin/bash    — інтерактивний вхід дозволено
        # /sbin/nologin — вхід заборонено (для сервісних акаунтів)

        groups: "{{ item.groups | join(',') }}"
        # item.groups — список Python: ["docker", "wheel"]
        # | join(',') — фільтр Jinja2, перетворює список у рядок: "docker,wheel"
        # Модуль user очікує рядок із групами через кому.

        append: true
        # true  — ДОДАТИ до вказаних груп (поточні групи зберігаються)
        # false — ЗАМІНИТИ всі додаткові групи на вказані (небезпечно!)

        create_home: true
        # Автоматично створити домашній каталог /home/<name>.
        # Копіює скелет із /etc/skel (bash_profile, bashrc тощо).

        state: present
        # present — користувач має існувати (створити якщо немає)
        # absent  — користувач має бути видалений (видалити якщо є)

      # ── loop ─────────────────────────────────────────────
      # loop — виконати цю задачу для кожного елемента зі списку.
      # {{ users }} — змінна з group_vars/all.yml (список із 10 об'єктів-користувачів).
      # Ansible виконає задачу 10 разів, щоразу підставляючи новий 'item'.
      loop: "{{ users }}"

      # loop_control.label — що відображати у лозі замість повного об'єкту item.
      # Без цього лог виводив би весь YAML-об'єкт кожного користувача.
      loop_control:
        label: "{{ item.name }}"


    # ════════════════════════════════════════════════════
    # ЗАДАЧА 2: Встановлення системних пакетів
    # ════════════════════════════════════════════════════
    #
    # Модуль: ansible.builtin.dnf
    # Керує пакетами через DNF — пакетний менеджер Amazon Linux 2023, RHEL 8+, Fedora.
    # Ідемпотентний: якщо пакет вже встановлений — нічого не робить.
    #
    # Аналог shell-команди:
    #   dnf install -y git docker net-tools
    # ────────────────────────────────────────────────────

    - name: "Встановити системні пакети"
      ansible.builtin.dnf:

        name: "{{ packages }}"
        # Передаємо весь список одним викликом — це ефективніше, ніж loop.
        # DNF встановлює всі пакети за одну транзакцію.
        # {{ packages }} — змінна з group_vars/all.yml: [git, docker, net-tools]

        state: present
        # present — встановити якщо не встановлено
        # absent  — видалити якщо встановлено
        # latest  — встановити або оновити до останньої доступної версії

        update_cache: true
        # Оновити локальний кеш метаданих репозиторіїв перед операцією.
        # Аналог: dnf makecache
        # Гарантує що встановлюється актуальна версія, а не застарілий кеш.


    # ════════════════════════════════════════════════════
    # ЗАДАЧА 3: Запуск та автозапуск Docker
    # ════════════════════════════════════════════════════
    #
    # Модуль: ansible.builtin.systemd
    # Керує systemd сервісами (start/stop/restart/enable/disable).
    # Ідемпотентний: якщо Docker вже запущений і увімкнений — нічого не робить.
    #
    # Аналог shell-команд:
    #   systemctl start docker
    #   systemctl enable docker
    # ────────────────────────────────────────────────────

    - name: "Запустити та увімкнути сервіс Docker"
      ansible.builtin.systemd:

        name: docker
        # Ім'я systemd unit файлу (без суфіксу .service).
        # Відповідає файлу /usr/lib/systemd/system/docker.service.

        state: started
        # started   — запустити якщо не запущений (аналог: systemctl start)
        # stopped   — зупинити якщо запущений   (аналог: systemctl stop)
        # restarted — перезапустити завжди       (аналог: systemctl restart)
        # reloaded  — перезавантажити конфіг     (аналог: systemctl reload)

        enabled: true
        # true  — увімкнути автозапуск при старті ОС (аналог: systemctl enable)
        # false — вимкнути автозапуск                (аналог: systemctl disable)


    # ════════════════════════════════════════════════════
    # ЗАДАЧА 4: Додавання користувачів до групи docker
    # ════════════════════════════════════════════════════
    #
    # Членство у групі 'docker' дозволяє запускати docker команди без sudo.
    # Додаємо лише тих користувачів, у кого 'docker' вказано у списку груп.
    #
    # Аналог shell-команди:
    #   usermod -aG docker deploy
    # ────────────────────────────────────────────────────

    - name: "Додати {{ item.name }} до групи docker"
      ansible.builtin.user:
        name:   "{{ item.name }}"
        groups: docker
        append: true  # -aG у usermod: лише ДОДАТИ групу, не перезаписувати

      loop: "{{ users }}"
      loop_control:
        label: "{{ item.name }}"

      # ── when — умовне виконання ───────────────────────
      # Задача виконується ТІЛЬКИ якщо умова істинна.
      # "'docker' in item.groups" — перевіряє чи є рядок 'docker' у списку груп.
      #
      # Результат для кожного користувача:
      #   deploy    → groups: ["docker"]          → виконати (docker є у списку)
      #   devops    → groups: ["docker", "wheel"] → виконати (docker є у списку)
      #   monitoring → groups: []                 → ПРОПУСТИТИ (docker відсутній)
      #   sysadmin  → groups: ["wheel"]           → ПРОПУСТИТИ (docker відсутній)
      when: "'docker' in item.groups"

    - name: "Запустити Docker контейнер"
      community.docker.docker_container:
        name:    devops-landing
        image:   rossogamata/devops-landing:v1.0
        # (за додаткові бали: використайте власний Docker image із Lesson 7.1)
        state:   started
        restart_policy: always
        ports:
          - "80:80"
